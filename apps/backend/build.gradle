buildscript {
	repositories { mavenCentral() }
	// Classpath del plugin de Flyway (para ./gradlew flywayMigrate): driver JDBC +
	// módulo de base de datos (Flyway 12 lo separó del core).
	dependencies {
		classpath 'org.postgresql:postgresql:42.7.7'
		classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version '12.4.0'
	id 'jacoco'
}

group = 'com.grupobolivar'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// El oráculo de descuentos (packages/fixtures/discount-cases.json) queda en el classpath
// de test para el @ParameterizedTest de DiscountPipeline: mismos números que el frontend.
sourceSets {
	test {
		resources {
			srcDir file('../../packages/fixtures')
		}
	}
}

// Migraciones ejecutables de forma independiente de la app (./gradlew flywayMigrate,
// flywayInfo, flywayClean). Apunta al PostgreSQL de compose.yaml.
flyway {
	url = System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:postgresql://localhost:5432/ecommerce'
	user = System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'ecommerce'
	password = System.getenv('SPRING_DATASOURCE_PASSWORD') ?: 'ecommerce'
	locations = ['filesystem:src/main/resources/db/migration']
	cleanDisabled = false
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	// Arranca automáticamente compose.yaml en `bootRun`; no entra al classpath de prod ni de test.
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	// Tests de integración contra PostgreSQL real vía Testcontainers (misma BD que prod).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// Cobertura (requisito 4.3 del enunciado: >= 80% en las capas lógicas esenciales).
// El denominador de cobertura se restringe al motor de descuentos y a la
// orquestación de aplicación; DTOs, entidades JPA, configuración y el bootstrap
// de Spring quedan fuera porque no contienen lógica de negocio que testear.
// ---------------------------------------------------------------------------
ext.coverageIncludes = [
	'com/grupobolivar/ecommerce/checkout/domain/**',
	'com/grupobolivar/ecommerce/checkout/application/**',
	'com/grupobolivar/ecommerce/catalog/domain/**',
	'com/grupobolivar/ecommerce/catalog/application/**',
]
ext.coverageExcludes = [
	'**/*Application.*',
	'**/*Entity.*',
	'**/*Request.*',
	'**/*Response.*',
	'**/dto/**',
	'**/config/**',
	'**/*Configuration.*',
	'**/*Properties.*',
	'**/package-info.*',
]

def scopedClassDirs(classDirs) {
	files(classDirs.files.collect { dir ->
		fileTree(dir: dir, includes: coverageIncludes, excludes: coverageExcludes)
	})
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(scopedClassDirs(sourceSets.main.output.classesDirs))
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')
	classDirectories.setFrom(scopedClassDirs(sourceSets.main.output.classesDirs))
	violationRules {
		rule {
			element = 'BUNDLE'
			limit { counter = 'LINE';   minimum = 0.80 }
			limit { counter = 'BRANCH'; minimum = 0.80 }
		}
	}
}

// Gate de cobertura (requisito 4.3): `./gradlew check` falla si LINE o BRANCH < 80%
// en checkout.domain / checkout.application (y equivalentes de catalog).
tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
