spring:
  application:
    name: ecommerce-backend

  # En `bootRun`, spring-boot-docker-compose levanta este compose.yaml (PostgreSQL 16)
  # y conecta el datasource automáticamente. En producción se apunta a la BD real por env.
  docker:
    compose:
      enabled: true
      file: compose.yaml
      # start-only: al parar la app el contenedor sigue vivo, para poder inspeccionar
      # la base con psql / un cliente. Se detiene con `docker compose down`.
      lifecycle-management: start-only

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce

  jpa:
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida que las entidades cuadren.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------------------------------------------------------------------
# Afinado del motor de descuentos. La tasa de la Regla 1 vive en categories.discount_rate
# y los cupones en la tabla coupons; aquí solo quedan el umbral/porcentaje de volumen y
# el tope absoluto (parámetros de política, no datos de catálogo).
# ---------------------------------------------------------------------------
discount:
  volume:
    threshold: 100.00
    percent: 0.05
  cap:
    percent: 0.35

# Prefijo del radicado de la orden: <prefix>-<yyyyMMddHHmmssSSS>.
order:
  reference:
    prefix: ORD
