spring:
  datasource:
    # H2 en memoria: aislamiento total entre tests, sin fichero en disco.
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

discount:
  category:
    name: "Tecnología"
    percent: 0.10
  volume:
    threshold: 100.00
    percent: 0.05
  cap:
    percent: 0.35
  coupons:
    - code: "WELCOME2026"
      percent: 0.15
      active: true
    - code: "MEGADESCUENTO"
      percent: 0.50
      active: true
    - code: "EXPIRED2020"
      percent: 0.10
      active: false
