<app-global-loader />

<header class="topbar">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <img class="logo" src="assets/logo-large.png" alt="Davitienda" />
  </a>

  <button
    type="button"
    class="menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-nav"
    aria-label="Menú"
    (click)="toggleMenu()"
  >
    <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
  </button>

  <nav id="main-nav" class="nav" [class.open]="menuOpen()">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      >Inicio</a
    >
    <a routerLink="/store" routerLinkActive="active" (click)="closeMenu()">Tienda</a>
    <a routerLink="/shopping" routerLinkActive="active" (click)="closeMenu()">Mis compras</a>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<app-site-footer />
