<section>
  <h2>Catálogo</h2>
  @if (loading()) {
    <p class="dv-muted">Cargando productos…</p>
  }
  <div class="grid">
    @for (product of products(); track product.id) {
      <app-product-card
        [product]="product"
        (add)="onAdd($event)"
        (details)="selectedId.set(product.id)"
      />
    }
  </div>
</section>

@if (selectedId(); as id) {
  <app-product-detail-dialog [productId]="id" (closed)="selectedId.set(null)" />
}
